plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"legacy-resources" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// The derivation lab: a local web UI for tuning the texture derivations in
// dev.oery.legacyresources.client.derive against every legacy pack in ~/.minecraft/resourcepacks at once.
// See src/lab/java/.../lab/LabServer.java. It is a development harness only - deliberately its own
// source set, absent from the loom { mods { ... } } block above and from the jar, so none of it can
// reach the published mod. It does sit on the client source set's classpath, because it drives the
// real LegacyPackResources conversion rather than a reimplementation of it.
sourceSets {
	// Version-neutral contracts and comparison code. Kept Java 8 compatible so the
	// separate legacy process and the current-game lab use byte-identical schemas.
	entityOracle {
		compileClasspath += sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.client.runtimeClasspath
	}
	// Instrumentation and the 1.8.9 runner. This is deliberately not part of the
	// Loom mod or any publication.
	legacyOracle {
		compileClasspath += sourceSets.entityOracle.output + sourceSets.entityOracle.compileClasspath
		runtimeClasspath += sourceSets.entityOracle.output + sourceSets.entityOracle.runtimeClasspath
	}
	lab {
		compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output + sourceSets.main.output + sourceSets.entityOracle.output
		runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output + sourceSets.main.output + sourceSets.entityOracle.output
	}
}

configurations {
	legacyOracleImplementation.extendsFrom entityOracleImplementation
}

dependencies {
	// Used only by the development oracle agent. It is never included in the mod.
	legacyOracleImplementation 'org.ow2.asm:asm:9.10.1'
	legacyOracleImplementation 'org.ow2.asm:asm-tree:9.10.1'
}

def legacyVersionDir = providers.provider {
	new File(System.getProperty('user.home'), '.minecraft/versions/1.8.9')
}
def legacyClientJar = legacyVersionDir.map { new File(it, '1.8.9.jar') }
def legacyVersionJson = legacyVersionDir.map { new File(it, '1.8.9.json') }
def legacyOutputDir = layout.buildDirectory.dir('legacy-entity-oracle/1.8.9')

def locateLegacyJava8 = {
	if (project.hasProperty('legacyOracle.java8')) return file(project.property('legacyOracle.java8'))
	def runtime = new File(System.getProperty('user.home'), '.minecraft/runtime/jre-legacy')
	def candidates = [new File(runtime, 'bin/java'), new File(runtime, 'linux/bin/java'), new File(runtime, 'linux/jre-legacy/bin/java')]
	def found = candidates.find { it.isFile() && it.canExecute() }
	if (found == null) throw new GradleException("Minecraft Java 8 was not found under ${runtime}. Install 1.8.9 with the official launcher or pass -PlegacyOracle.java8=/path/to/java. Nothing will be downloaded.")
	return found
}

def readLegacyInstall = {
	def jar = legacyClientJar.get()
	def json = legacyVersionJson.get()
	def missing = [jar, json].findAll { !it.isFile() }
	if (!missing.empty) throw new GradleException('Missing official launcher files:\n  ' + missing.join('\n  ') + '\nLaunch Minecraft 1.8.9 once. This project never downloads Minecraft files.')
	def metadata = new groovy.json.JsonSlurper().parse(json)
	def expected = metadata.downloads?.client?.sha1
	if (!(expected instanceof String)) throw new GradleException("${json} has no downloads.client.sha1; refusing an unverifiable client")
	def digest = java.security.MessageDigest.getInstance('SHA-1').digest(jar.bytes).encodeHex().toString()
	if (digest != expected) throw new GradleException("Refusing modified or unknown 1.8.9 client ${jar}: expected SHA-1 ${expected}, found ${digest}")
	def librariesRoot = new File(System.getProperty('user.home'), '.minecraft/libraries')
	def ruleAllowsLinux = { lib ->
		if (!lib.rules) return true
		def allowed = false
		lib.rules.each { rule ->
			def applies = !rule.os || rule.os.name == 'linux'
			if (applies) allowed = rule.action == 'allow'
		}
		allowed
	}
	def libraryEntries = metadata.libraries.findAll { ruleAllowsLinux(it) && it.downloads?.artifact }
	def libraries = libraryEntries.collect { lib ->
		def artifact = lib.downloads?.artifact
		def path = artifact?.path
		if (path == null) {
			def bits = lib.name.split(':')
			path = bits[0].replace('.', '/') + '/' + bits[1] + '/' + bits[2] + '/' + bits[1] + '-' + bits[2] + '.jar'
		}
		new File(librariesRoot, path)
	}
	def absent = libraries.findAll { !it.isFile() }
	if (!absent.empty) throw new GradleException('Missing launcher libraries (nothing was downloaded):\n  ' + absent.join('\n  '))
	libraryEntries.eachWithIndex { lib, index ->
		def expectedLibraryHash = lib.downloads.artifact.sha1
		if (expectedLibraryHash) {
			def actualLibraryHash = java.security.MessageDigest.getInstance('SHA-1').digest(libraries[index].bytes).encodeHex().toString()
			if (actualLibraryHash != expectedLibraryHash) throw new GradleException("Refusing modified launcher library ${libraries[index]}: expected SHA-1 ${expectedLibraryHash}, found ${actualLibraryHash}")
		}
	}
	[jar: jar, json: json, sha1: digest, libraries: libraries]
}

tasks.named('compileEntityOracleJava', JavaCompile) { options.release = 8 }
tasks.named('compileLegacyOracleJava', JavaCompile) { options.release = 8 }

tasks.register('legacyOracleAgentJar', Jar) {
	dependsOn tasks.named('legacyOracleClasses')
	archiveClassifier = 'legacy-oracle-agent'
	from sourceSets.legacyOracle.output
	from sourceSets.entityOracle.output
	manifest {
		attributes('Premain-Class': 'dev.oery.legacyresources.oracle.legacy.LegacyOracleAgent',
			'Can-Redefine-Classes': 'false', 'Can-Retransform-Classes': 'false')
	}
}

tasks.register('captureLegacyEntityOracle') {
	group = 'legacy-resources'
	description = 'Captures local geometry from the verified official Minecraft 1.8.9 client (never downloads files)'
	dependsOn tasks.named('legacyOracleAgentJar')
	doLast {
		def install = readLegacyInstall()
		def java8 = locateLegacyJava8()
		def agent = tasks.named('legacyOracleAgentJar', Jar).get().archiveFile.get().asFile
		def cp = ([agent, install.jar] + install.libraries + configurations.legacyOracleRuntimeClasspath.files).unique().join(File.pathSeparator)
		def args = [java8.absolutePath, "-javaagent:${agent.absolutePath}", '-cp', cp,
			'dev.oery.legacyresources.oracle.legacy.LegacyOracleMain',
			'--client', install.jar.absolutePath, '--version-json', install.json.absolutePath,
			'--sha1', install.sha1, '--output', legacyOutputDir.get().asFile.absolutePath,
			'--scenarios', file('src/entityOracle/resources/scenarios').absolutePath]
		if (project.hasProperty('legacyEntity')) args += ['--entity', project.property('legacyEntity').toString()]
		if (project.hasProperty('legacyScenario')) args += ['--scenario', project.property('legacyScenario').toString()]
		def execution = providers.exec { commandLine args; ignoreExitValue = true }
		def stdout = execution.standardOutput.asText.get()
		def stderr = execution.standardError.asText.get()
		if (stdout) logger.lifecycle(stdout.trim())
		if (stderr) logger.error(stderr.trim())
		execution.result.get().assertNormalExitValue()
	}
}

tasks.register('verifyLegacyEntityOracleHarness', JavaExec) {
	group = 'verification'
	description = 'Runs deterministic synthetic trace/comparator mutation tests without Minecraft data'
	dependsOn tasks.named('entityOracleClasses')
	classpath = sourceSets.entityOracle.runtimeClasspath
	mainClass = 'dev.oery.legacyresources.oracle.SyntheticHarness'
}

tasks.register('compareLegacyEntityModels', JavaExec) {
	group = 'verification'
	description = 'Compares current production models with cached local 1.8.9 captures; never regenerates snapshots'
	dependsOn tasks.named('labClasses')
	classpath = sourceSets.lab.runtimeClasspath
	mainClass = 'dev.oery.legacyresources.lab.entityoracle.ModernOracleMain'
	systemProperty 'legacyOracle.project', projectDir.absolutePath
	if (project.hasProperty('legacyEntity')) args '--entity', project.property('legacyEntity')
	if (project.hasProperty('legacyScenario')) args '--scenario', project.property('legacyScenario')
}

tasks.register('verifyLegacyEntityModels') {
	group = 'verification'
	description = 'Strictly compares every cached entity scenario (kept outside check while pilot mismatches remain)'
	dependsOn tasks.named('compareLegacyEntityModels')
}

tasks.register('explainLegacyEntityFailure', JavaExec) {
	group = 'verification'
	description = 'Prints the worst cached entity-model mismatch and its complete scenario inputs'
	dependsOn tasks.named('labClasses')
	classpath = sourceSets.lab.runtimeClasspath
	mainClass = 'dev.oery.legacyresources.lab.entityoracle.ExplainFailureMain'
	systemProperty 'legacyOracle.project', projectDir.absolutePath
	if (project.hasProperty('legacyEntity')) args '--entity', project.property('legacyEntity')
	if (project.hasProperty('legacyScenario')) args '--scenario', project.property('legacyScenario')
}

tasks.register('runLab', JavaExec) {
	group = 'legacy-resources'
	description = 'Runs the derivation lab at http://localhost:8642'
	classpath = sourceSets.lab.runtimeClasspath
	mainClass = 'dev.oery.legacyresources.lab.LabServer'
	// The lab reads its web assets, the derivation sources it recompiles, and reference/ straight off
	// disk rather than from the classpath, so that editing any of them takes effect on a page refresh.
	systemProperty 'lab.project', projectDir.absolutePath
	// Overridable with, e.g., -Plab.packs=/path/to/resourcepacks -Plab.port=9000
	if (project.hasProperty('lab.packs')) {
		systemProperty 'lab.packs', project.property('lab.packs')
	}
	if (project.hasProperty('lab.port')) {
		systemProperty 'lab.port', project.property('lab.port')
	}
}

tasks.register('generateModelNameMaps', JavaExec) {
	group = 'legacy-resources'
	description = 'Derives safe legacy-to-modern blockstate and block-model aliases from vanilla assets'
	classpath = sourceSets.lab.runtimeClasspath
	mainClass = 'dev.oery.legacyresources.lab.ModelNameMapGenerator'
	systemProperty 'lab.project', projectDir.absolutePath
	if (project.hasProperty('modelMap.report')) {
		args '--report'
	}
}

tasks.register('verifyModelNameMaps', JavaExec) {
	group = 'verification'
	description = 'Checks that every safe vanilla-derived block-model alias is bundled'
	classpath = sourceSets.lab.runtimeClasspath
	mainClass = 'dev.oery.legacyresources.lab.ModelNameMapGenerator'
	systemProperty 'lab.project', projectDir.absolutePath
	args '--check'
}

tasks.register('verifyEntityCompatibility', JavaExec) {
	group = 'verification'
	description = 'Checks entity texture aliases through the real converted-pack wrapper over the full corpus'
	classpath = sourceSets.lab.runtimeClasspath
	mainClass = 'dev.oery.legacyresources.lab.EntityCompatibilityVerifier'
	systemProperty 'lab.project', projectDir.absolutePath
	if (project.hasProperty('lab.packs')) {
		systemProperty 'lab.packs', project.property('lab.packs')
	}
}

tasks.register('verifyChestCompatibility', JavaExec) {
	group = 'verification'
	description = 'Checks corrected single and double chest sheets through converted PureBDcraft'
	classpath = sourceSets.lab.runtimeClasspath
	mainClass = 'dev.oery.legacyresources.lab.ChestCompatibilityVerifier'
	systemProperty 'lab.project', projectDir.absolutePath
	if (project.hasProperty('lab.packs')) {
		systemProperty 'lab.packs', project.property('lab.packs')
	}
}

tasks.register('verifyReportedIssues', JavaExec) {
	group = 'verification'
	description = 'Checks the reported custom-model regressions through the converted PureBDcraft pack'
	classpath = sourceSets.lab.runtimeClasspath
	mainClass = 'dev.oery.legacyresources.lab.ReportedIssueVerifier'
	systemProperty 'lab.project', projectDir.absolutePath
	if (project.hasProperty('lab.packs')) {
		systemProperty 'lab.packs', project.property('lab.packs')
	}
}

tasks.register('verifyLegacyItemTransforms', JavaExec) {
	group = 'verification'
	description = 'Checks legacy item display matrices against the 1.8.9 vanilla model tree'
	classpath = sourceSets.lab.runtimeClasspath
	mainClass = 'dev.oery.legacyresources.client.convert.LegacyItemTransformVerifier'
	systemProperty 'lab.project', projectDir.absolutePath
}

tasks.register('verifyModelCompatibility', JavaExec) {
	group = 'verification'
	description = 'Runs converted models, blockstates and item definitions through the game loaders over the full corpus'
	classpath = sourceSets.lab.runtimeClasspath
	mainClass = 'dev.oery.legacyresources.lab.ModelCompatibilityVerifier'
	systemProperty 'lab.project', projectDir.absolutePath
	if (project.hasProperty('lab.packs')) {
		systemProperty 'lab.packs', project.property('lab.packs')
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	if (it.name != 'compileEntityOracleJava' && it.name != 'compileLegacyOracleJava') it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
