plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"legacy-resources" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// The derivation lab: a local web UI for tuning the texture derivations in
// dev.oery.legacyresources.client.derive against every legacy pack in ~/.minecraft/resourcepacks at once.
// See src/lab/java/.../lab/LabServer.java. It is a development harness only - deliberately its own
// source set, absent from the loom { mods { ... } } block above and from the jar, so none of it can
// reach the published mod. It does sit on the client source set's classpath, because it drives the
// real LegacyPackResources conversion rather than a reimplementation of it.
sourceSets {
	lab {
		compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output + sourceSets.main.output
		runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output + sourceSets.main.output
	}
}

tasks.register('runLab', JavaExec) {
	group = 'legacy-resources'
	description = 'Runs the derivation lab at http://localhost:8642'
	classpath = sourceSets.lab.runtimeClasspath
	mainClass = 'dev.oery.legacyresources.lab.LabServer'
	// The lab reads its web assets, the derivation sources it recompiles, and reference/ straight off
	// disk rather than from the classpath, so that editing any of them takes effect on a page refresh.
	systemProperty 'lab.project', projectDir.absolutePath
	// Overridable with, e.g., -Plab.packs=/path/to/resourcepacks -Plab.port=9000
	if (project.hasProperty('lab.packs')) {
		systemProperty 'lab.packs', project.property('lab.packs')
	}
	if (project.hasProperty('lab.port')) {
		systemProperty 'lab.port', project.property('lab.port')
	}
}

tasks.register('generateModelNameMaps', JavaExec) {
	group = 'legacy-resources'
	description = 'Derives safe legacy-to-modern blockstate and block-model aliases from vanilla assets'
	classpath = sourceSets.lab.runtimeClasspath
	mainClass = 'dev.oery.legacyresources.lab.ModelNameMapGenerator'
	systemProperty 'lab.project', projectDir.absolutePath
}

tasks.register('verifyModelNameMaps', JavaExec) {
	group = 'verification'
	description = 'Checks that every safe vanilla-derived block-model alias is bundled'
	classpath = sourceSets.lab.runtimeClasspath
	mainClass = 'dev.oery.legacyresources.lab.ModelNameMapGenerator'
	systemProperty 'lab.project', projectDir.absolutePath
	args '--check'
}

tasks.register('verifyEntityCompatibility', JavaExec) {
	group = 'verification'
	description = 'Checks entity texture aliases through the real converted-pack wrapper over the full corpus'
	classpath = sourceSets.lab.runtimeClasspath
	mainClass = 'dev.oery.legacyresources.lab.EntityCompatibilityVerifier'
	systemProperty 'lab.project', projectDir.absolutePath
	if (project.hasProperty('lab.packs')) {
		systemProperty 'lab.packs', project.property('lab.packs')
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
